name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    # the public build only, as in the ci app job: the owner's dog, human and voice clip from
    # app/assets (owner decision, 2026-11-25), no weights
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      # the hackbuild-ui pin: tarball, sha-256, SHA256SUMS, package.json and lockfile agree
      - run: node tools/vendor/pin-ui.mjs --check
      - run: npm ci
      - run: npm run build:public
        env:
          SUITE_URL: https://hackbuild.github.io/hackbuild-suite/
      - run: node --test tools/test/build-app.test.mjs
      - name: check the public file
        env:
          BLOCKED_NAMES: ${{ secrets.BLOCKED_NAMES }}
        run: |
          node -e '
          const s = require("fs").readFileSync("dist/dog-simulator-public.html", "utf8");
          const block = (id) => (s.match(new RegExp("id=\"" + id + "\">([\\s\\S]*?)</script>")) || [])[1].trim();
          const fail = (m) => { console.error(m); process.exit(1); };
          // exactly the three files in app/assets: the dog, the human and the voice clip
          const b64 = (f) => require("fs").readFileSync("app/assets/" + f).toString("base64");
          if (block("dogGLB") !== b64("dog.glb")) fail("the dog is not app/assets/dog.glb");
          if (block("humanGLB") !== b64("human.glb")) fail("the human is not app/assets/human.glb");
          if (block("voiceB64") !== b64("voice.wav")) fail("the voice clip is not app/assets/voice.wav");
          const glb = (s.match(/Z2xURg/g) || []).length;
          if (glb !== 2) fail("expected two GLBs (the dog and the human), found " + glb);
          // drop base64 runs of 200 or more characters with a linear scan; a regex overflows the stack on the embedded models
          const isB = (c) => (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122) || c === 43 || c === 47 || c === 61;
          let text = "", i = 0;
          while (i < s.length) { let j = i; while (j < s.length && isB(s.charCodeAt(j))) j++; if (j - i < 200) text += s.slice(i, j); if (j === i) { text += s[i]; j++; } i = j; }
          // names that must never ship come from a repository secret, never from this file
          for (const n of (process.env.BLOCKED_NAMES || "").split(",").map((x) => x.trim()).filter(Boolean)) if (text.includes(n)) fail("a blocked name is in the page");
          console.log("public file clean");
          '
      - run: mkdir -p _site && cp dist/dog-simulator-public.html _site/index.html
      # the human as a plain file for the suite's character and room explorers; pages sends
      # access-control-allow-origin: * on every file, so a cors fetch from a cross origin
      # isolated page loads it (coep credentialless or require-corp)
      - run: mkdir -p _site/assets && cp app/assets/human.glb _site/assets/human.glb
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
