name: ci
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  house-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: node --test tools/test/*.test.mjs
      - run: git ls-files -z | grep -zEv '\.(png|jpe?g|gif|webp|glb|gltf|bin|wasm|onnx|wav|ico|woff2?|ttf)$|^(vendor/|LICENSES/|RULES.md|CLAUDE.md|tools/|legacy/)|package-lock.json|Cargo.lock' | xargs -0 node tools/lint-voice.mjs
      - run: node tools/lint-commits.mjs
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: node tools/vendor-libs.mjs --check
      - run: npm run build --if-present
      - run: npm run typecheck
      - run: npm test
  app:
    # the public build (stub dog, placeholder human, nothing from assets-local), the licence
    # isolation test on it, and the public scenario goldens in lockstep on SwiftShader
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install -g npm@11.21.0
      - run: npm ci
      - run: npm run build:public
      - run: node --test tools/test/build-app.test.mjs
      - run: node scenarios/run.mjs compare --set public --jobs 2 --no-metrics --tag ci
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CHROME_ARGS: --no-sandbox
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-report
          path: scenarios/reports/compare-public-cpg-ci.json
          if-no-files-found: ignore
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: test -f Cargo.toml || exit 0
      - run: rustup target add wasm32-unknown-unknown
        if: hashFiles('Cargo.toml') != ''
      - run: cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace
        if: hashFiles('Cargo.toml') != ''
