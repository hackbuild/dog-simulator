<!DOCTYPE html><html><head><script type="importmap">{"imports":{"three":"../vendor/three/three.webgpu.js","three/addons/":"../vendor/three/addons/"}}</script></head><body style="margin:0;background:#eee">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const A = await (await fetch('./hanims.json')).json();
const g = await new GLTFLoader().loadAsync('./moheeb.glb');

scene.add(new THREE.HemisphereLight('#fff', '#998', 2)); const d = new THREE.DirectionalLight('#fff', 2); d.position.set(2, 4, 3); scene.add(d);

const box = new THREE.Box3().setFromObject(root, true); const s = 1.75 / (box.max.y - box.min.y); root.scale.setScalar(s); root.position.y = -box.min.y * s;
const holder = new THREE.Group(); holder.add(root); scene.add(holder);
const byName = {}; root.traverse(o => { if (o.isBone) byName[o.name] = o; });
const T = { hips: 'Hips', spine: 'Spine02', chest: 'Spine01', upperChest: 'Spine', neck: 'neck', head: 'Head', shoulderL: 'LeftShoulder', upperArmL: 'LeftArm', lowerArmL: 'LeftForeArm', handL: 'LeftHand', shoulderR: 'RightShoulder', upperArmR: 'RightArm', lowerArmR: 'RightForeArm', handR: 'RightHand', upperLegL: 'LeftUpLeg', lowerLegL: 'LeftLeg', footL: 'LeftFoot', upperLegR: 'RightUpLeg', lowerLegR: 'RightLeg', footR: 'RightFoot' };

const hipH = 0.55 * 1.75;
window.pose = (name, k, cols, side) => {
  const c = A.clips[name], q = dec(c.q), p = dec(c.p), R = A.roles.length;
  const f = Math.round(k / (cols - 1) * (c.n - 1));

</script></body></html>
