<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hackle browser dog</title>
<link rel="icon" href="data:,">
<style>/*@@FONTS@@*/</style>
<style>/*@@HBUI@@*/</style>
<style>
/*
The dog simulator page: the bar and the yard under it. The yard is @hackbuild/agents-views Yard,
its stage, rack, setup panel and command palette; this page holds the bar it puts its chips in,
the owner's models and voice clip, and the fonts and class layer. Under 900 px the page scrolls as one.
*/
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body.hb{overflow:hidden;overscroll-behavior:none}
body.hb::before{display:none}
#app{display:grid;grid-template-rows:52px minmax(0,1fr);height:100vh;height:100dvh}
#app>.hb-header{overflow:hidden}
#app>.hb-header h1{font-size:26px;letter-spacing:.5px;flex:0 0 auto}
#app>.hb-header .hb-tagline{margin-left:0;flex:0 1 auto}
#app>main{min-height:0;min-width:0}
@media (min-width:901px){#app>.hb-header .hb-tagline{display:block}}
@media (max-width:900px){body.hb{overflow:auto}#app{height:auto;min-height:100%;grid-template-rows:52px auto}}
</style>
</head>
<body class="hb">
<div id="app">
<header class="hb-header" data-ux="bar">
  <h1>hackle<span>.</span></h1>
  <span class="hb-tagline is-tool">a dog with a brain, a body and eyes, running in your browser</span>
</header>
<main id="yard" aria-label="the yard"></main>
</div>
<script type="module">/*@@APP@@*/</script>
<script type="text/plain" id="voiceB64">
@@VOICE_B64@@
</script>
<script type="application/json" id="humanAnims">
@@ANIMS@@
</script>
<script type="application/octet-stream" id="humanGLB">
@@HUMAN_GLB@@
</script>
<script type="application/octet-stream" id="dogGLB">
@@DOG_GLB@@
</script>
</body>
</html>
